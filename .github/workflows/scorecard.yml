# OpenSSF Scorecard: an outside measurement of how this repository is kept.
#
# It checks practices rather than code — pinned actions, token permissions,
# branch protection, a security policy, signed releases, dependency scanning —
# and publishes a score anyone can read at
# https://securityscorecards.dev/viewer/?uri=github.com/getsmartable-app/core
#
# `publish_results: true` makes the score public and is what the README badge
# reads. Scorecard verifies the workflow that produced it, so this file stays
# as close to the project's own template as possible: read-only by default,
# write only where the job needs it, and nothing else in the job.
name: Scorecard

on:
  # Branch protection is one of the checks; re-run when it changes.
  branch_protection_rule:
  schedule:
    - cron: '41 6 * * 1'
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  # Scorecard and code scanning are free on a public repository and need a
  # paid plan on a private one, and the organization stays on GitHub Free, so
  # nothing runs while the repository is private. A scheduled run's event
  # carries no repository, so the visibility is asked of the API — in a job of
  # its own, because Scorecard accepts only its listed actions in the job it
  # publishes from.
  visibility:
    name: Repository visibility
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      public: ${{ steps.read.outputs.public }}
    steps:
      - id: read
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          private=$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)
          if [ "$private" = false ]; then public=true; else public=false; fi
          echo "public=$public" >> "$GITHUB_OUTPUT"

  analysis:
    name: Scorecard analysis
    needs: visibility
    if: needs.visibility.outputs.public == 'true'
    runs-on: ubuntu-latest
    permissions:
      # Upload the results to Security → Code scanning.
      security-events: write
      # Publish the results and read the badge's identity.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
